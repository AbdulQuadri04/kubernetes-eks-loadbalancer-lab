apiVersion: v1
kind: Service

metadata:
  name: nginx-svc-lb

  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing

spec:
  type: LoadBalancer

  loadBalancerClass: eks.amazonaws.com/nlb

  selector:
    app: nginx

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
